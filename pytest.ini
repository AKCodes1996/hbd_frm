
[pytest]

# Test discovery configuration
testpaths = tests

python_files = test_*.py

python_functions = test_*

# Default execution options
addopts = -v -s

# Logging configuration
log_cli = true

log_cli_level = INFO

# Custom markers
markers =
    smoke: Smoke test cases
    regression: Regression test cases
    sanity: Sanity test cases
